# DEVELOPMENT-ONLY example. Replace every value before using this manifest.
# Prefer creating this Secret from a local, untracked file or a secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: banking-secrets
type: Opaque
stringData:
  # Patroni/PostgreSQL credentials shared by the three independent clusters.
  # Use distinct production credentials and a managed Secret in real deployments.
  POSTGRES_SUPERUSER_PASSWORD: "development-only-change-me"
  POSTGRES_REPLICATION_PASSWORD: "development-only-change-me"
  BANK_A_PASSWORD: "development-only-change-me"
  BANK_B_PASSWORD: "development-only-change-me"
  COORDINATOR_PASSWORD: "development-only-change-me"
  # These URLs target the Patroni primary Services planned for a later commit.
  # Keep each URL password equal to its corresponding password key above.
  BANK_A_DATABASE_URL: "postgresql+psycopg://banking_a_user:development-only-change-me@postgres-a-primary:5432/banking_a"
  BANK_B_DATABASE_URL: "postgresql+psycopg://banking_b_user:development-only-change-me@postgres-b-primary:5432/banking_b"
  COORDINATOR_DATABASE_URL: "postgresql+psycopg://banking_coordinator_user:development-only-change-me@postgres-coordinator-primary:5432/banking_coordinator"
