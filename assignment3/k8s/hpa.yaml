metadata:
  name: bank-b
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bank-b
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
