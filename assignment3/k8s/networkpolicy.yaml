apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: banking-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - bank-a
          - bank-b
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - gateway
                  - coordinator
      ports:
        - protocol: TCP
          port: 8000
