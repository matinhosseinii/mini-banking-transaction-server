name: assignment2-shards

services:
  bank-a:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_A_USER:?POSTGRES_A_USER is required}:${POSTGRES_A_PASSWORD:?POSTGRES_A_PASSWORD is required}@postgres-a:5432/${POSTGRES_A_DB:?POSTGRES_A_DB is required}"
      SHARD_ID: A
      MAX_CONCURRENT_CLIENTS: ${MAX_CONCURRENT_CLIENTS:?MAX_CONCURRENT_CLIENTS is required}
      LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL is required}
      UVICORN_LIMIT_CONCURRENCY: ${UVICORN_LIMIT_CONCURRENCY:-}
    ports:
      - "${API_BIND_IP:?API_BIND_IP is required}:8001:8000"
    depends_on:
      postgres-a:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).close()
      interval: 150s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - banking

  bank-b:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_B_USER:?POSTGRES_B_USER is required}:${POSTGRES_B_PASSWORD:?POSTGRES_B_PASSWORD is required}@postgres-b:5432/${POSTGRES_B_DB:?POSTGRES_B_DB is required}"
      SHARD_ID: B
      MAX_CONCURRENT_CLIENTS: ${MAX_CONCURRENT_CLIENTS:?MAX_CONCURRENT_CLIENTS is required}
      LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL is required}
      UVICORN_LIMIT_CONCURRENCY: ${UVICORN_LIMIT_CONCURRENCY:-}
    ports:
      - "${API_BIND_IP:?API_BIND_IP is required}:8002:8000"
    depends_on:
      postgres-b:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).close()
      interval: 150s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - banking

  postgres-a:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_A_DB:?POSTGRES_A_DB is required}
      POSTGRES_USER: ${POSTGRES_A_USER:?POSTGRES_A_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_A_PASSWORD:?POSTGRES_A_PASSWORD is required}
    volumes:
      - postgres-a-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - banking

  postgres-b:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_B_DB:?POSTGRES_B_DB is required}
      POSTGRES_USER: ${POSTGRES_B_USER:?POSTGRES_B_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_B_PASSWORD:?POSTGRES_B_PASSWORD is required}
    volumes:
      - postgres-b-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - banking

networks:
  banking:
    driver: bridge

volumes:
  postgres-a-data:
  postgres-b-data:
