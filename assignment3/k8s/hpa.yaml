apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bank-a
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bank-a
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
