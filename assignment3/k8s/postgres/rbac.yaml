apiVersion: v1
kind: ServiceAccount
metadata:
  name: patroni
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patroni
rules:
  - apiGroups: [""]
    resources: ["configmaps", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patroni
subjects:
  - kind: ServiceAccount
    name: patroni
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: patroni
