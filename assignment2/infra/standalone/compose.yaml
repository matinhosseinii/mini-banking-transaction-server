name: assignment2-gateway

x-bank-common: &bank-common
  build:
    context: ../..
    dockerfile: server/Dockerfile
  environment: &bank-environment
    MAX_CONCURRENT_CLIENTS: ${MAX_CONCURRENT_CLIENTS:?MAX_CONCURRENT_CLIENTS is required}
    LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL is required}
    UVICORN_LIMIT_CONCURRENCY: ${UVICORN_LIMIT_CONCURRENCY:-}
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - >-
        import urllib.request;
        urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).close()
    interval: 60s
    timeout: 5s
    retries: 5
    start_period: 10s
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - banking

services:
  bank-a1:
    <<: *bank-common
    environment:
      <<: *bank-environment
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_A_USER:?POSTGRES_A_USER is required}:${POSTGRES_A_PASSWORD:?POSTGRES_A_PASSWORD is required}@postgres-a:5432/${POSTGRES_A_DB:?POSTGRES_A_DB is required}"
      SHARD_ID: A
      REPLICA_ID: bank-a1
    depends_on:
      postgres-a:
        condition: service_healthy

  bank-a2:
    <<: *bank-common
    environment:
      <<: *bank-environment
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_A_USER:?POSTGRES_A_USER is required}:${POSTGRES_A_PASSWORD:?POSTGRES_A_PASSWORD is required}@postgres-a:5432/${POSTGRES_A_DB:?POSTGRES_A_DB is required}"
      SHARD_ID: A
      REPLICA_ID: bank-a2
    depends_on:
      postgres-a:
        condition: service_healthy

  bank-b1:
    <<: *bank-common
    environment:
      <<: *bank-environment
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_B_USER:?POSTGRES_B_USER is required}:${POSTGRES_B_PASSWORD:?POSTGRES_B_PASSWORD is required}@postgres-b:5432/${POSTGRES_B_DB:?POSTGRES_B_DB is required}"
      SHARD_ID: B
      REPLICA_ID: bank-b1
    depends_on:
      postgres-b:
        condition: service_healthy

  bank-b2:
    <<: *bank-common
    environment:
      <<: *bank-environment
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_B_USER:?POSTGRES_B_USER is required}:${POSTGRES_B_PASSWORD:?POSTGRES_B_PASSWORD is required}@postgres-b:5432/${POSTGRES_B_DB:?POSTGRES_B_DB is required}"
      SHARD_ID: B
      REPLICA_ID: bank-b2
    depends_on:
      postgres-b:
        condition: service_healthy

  gateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    environment:
      BANK_A1_URL: http://bank-a1:8000
      BANK_A2_URL: http://bank-a2:8000
      BANK_B1_URL: http://bank-b1:8000
      BANK_B2_URL: http://bank-b2:8000
      COORDINATOR_URL: http://coordinator:8000
      GATEWAY_HEALTH_INTERVAL_SECONDS: ${GATEWAY_HEALTH_INTERVAL_SECONDS:-5}
      GATEWAY_HEALTH_TIMEOUT_SECONDS: ${GATEWAY_HEALTH_TIMEOUT_SECONDS:-1}
      LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL is required}
    ports:
      - "${API_BIND_IP:?API_BIND_IP is required}:8000:8000"
    depends_on:
      bank-a1:
        condition: service_healthy
      bank-a2:
        condition: service_healthy
      bank-b1:
        condition: service_healthy
      bank-b2:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).close()
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - banking

  coordinator:
    build:
      context: ../..
      dockerfile: coordinator/Dockerfile
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_COORDINATOR_USER:-banking_coordinator_user}:${POSTGRES_COORDINATOR_PASSWORD:-fictional_coordinator_password}@postgres-coordinator:5432/${POSTGRES_COORDINATOR_DB:-banking_coordinator}"
      BANK_A1_URL: http://bank-a1:8000
      BANK_A2_URL: http://bank-a2:8000
      BANK_B1_URL: http://bank-b1:8000
      BANK_B2_URL: http://bank-b2:8000
      COORDINATOR_RECOVERY_INTERVAL_SECONDS: ${COORDINATOR_RECOVERY_INTERVAL_SECONDS:-5}
    depends_on:
      postgres-coordinator:
        condition: service_healthy
      bank-a1:
        condition: service_healthy
      bank-b1:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).close()
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - banking

  postgres-a:
    image: postgres:17
    command: ["postgres", "-c", "max_prepared_transactions=20"]
    environment:
      POSTGRES_DB: ${POSTGRES_A_DB:?POSTGRES_A_DB is required}
      POSTGRES_USER: ${POSTGRES_A_USER:?POSTGRES_A_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_A_PASSWORD:?POSTGRES_A_PASSWORD is required}
    volumes:
      - postgres-a-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - banking

  postgres-b:
    image: postgres:17
    command: ["postgres", "-c", "max_prepared_transactions=20"]
    environment:
      POSTGRES_DB: ${POSTGRES_B_DB:?POSTGRES_B_DB is required}
      POSTGRES_USER: ${POSTGRES_B_USER:?POSTGRES_B_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_B_PASSWORD:?POSTGRES_B_PASSWORD is required}
    volumes:
      - postgres-b-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - banking

  postgres-coordinator:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_COORDINATOR_DB:-banking_coordinator}
      POSTGRES_USER: ${POSTGRES_COORDINATOR_USER:-banking_coordinator_user}
      POSTGRES_PASSWORD: ${POSTGRES_COORDINATOR_PASSWORD:-fictional_coordinator_password}
    volumes:
      - postgres-coordinator-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - banking

networks:
  banking:
    driver: bridge

volumes:
  postgres-a-data:
  postgres-b-data:
  postgres-coordinator-data:
